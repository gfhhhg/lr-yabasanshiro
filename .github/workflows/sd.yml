name: Build RetroArch Core

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux version'
        type: boolean
        default: true
      build_android:
        description: 'Build Android version'
        type: boolean
        default: true

jobs:
  linux:
    name: Linux (${{ matrix.arch }} - ${{ matrix.variant }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux == true)
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [vulkan, opengl, gles]
        include:
          - arch: x86_64
            variant: vulkan
            make_params: HAVE_VULKAN=1
          - arch: x86_64
            variant: opengl
            make_params: ""
          - arch: x86_64
            variant: gles
            make_params: FORCE_GLES=1 HAVE_VULKAN=0
          - arch: aarch64
            variant: vulkan
            make_params: HAVE_VULKAN=1
          - arch: aarch64
            variant: opengl
            make_params: ""
          - arch: aarch64
            variant: gles
            make_params: FORCE_GLES=1 HAVE_VULKAN=0
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm \
            zlib1g-dev libflac-dev liblzma-dev libzstd-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libshaderc-dev

      - name: Build
        run: |
          make clean
          make ${{ matrix.make_params }} -j$(nproc)

      - name: Verify artifact
        run: |
          test -f yabasanshiro_libretro.so
          file yabasanshiro_libretro.so

      - uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro_linux_${{ matrix.arch }}_${{ matrix.variant }}
          path: yabasanshiro_libretro.so

  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true)
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: true

      - name: Build with ndk-build
        working-directory: src/libretro/jni
        run: |
          ndk-build APP_ABI=${{ matrix.abi }} -j$(nproc)

      - name: Find and rename artifact
        run: |
          SO_FILE="src/libretro/libs/${{ matrix.abi }}/libretro.so"
          if [ ! -f "$SO_FILE" ]; then
            echo "Error: .so file not found at $SO_FILE"
            echo "Searching for any .so files..."
            find src/libretro -name "*.so" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found: $SO_FILE"
          file "$SO_FILE"
          cp "$SO_FILE" "yabasanshiro_android_${{ matrix.abi }}.so"

      - uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro_android_${{ matrix.abi }}
          path: yabasanshiro_android_${{ matrix.abi }}.so

  release:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    needs: [linux, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List and organize artifacts
        run: |
          mkdir -p release_assets
          find artifacts -type f -name "*.so" | while read -r file; do
            basename=$(basename "$file")
            cp "$file" "release_assets/${basename}"
          done
          ls -la release_assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release_assets/*
