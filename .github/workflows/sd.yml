name: Build RetroArch Core

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux version'
        type: boolean
        default: true
      build_android:
        description: 'Build Android version'
        type: boolean
        default: true
      linux_arch:
        description: 'Linux architectures (comma separated)'
        type: string
        default: 'x86_64,aarch64'
      android_abi:
        description: 'Android ABIs (comma separated)'
        type: string
        default: 'arm64-v8a,armeabi-v7a,x86_64'

jobs:
  # ============================================================
  # Linux 构建任务
  # ============================================================
  linux:
    name: Linux (${{ matrix.arch }} - ${{ matrix.variant }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux == true)
    strategy:
      fail-fast: false
      matrix:
        arch: 
          - x86_64
          - aarch64
        variant: 
          - { name: vulkan, make: "HAVE_VULKAN=1" }
          - { name: opengl, make: "" }
          - { name: gles, make: "FORCE_GLES=1 HAVE_VULKAN=0" }
        # 允许通过 workflow_dispatch 过滤架构
        exclude:
          - arch: aarch64
            variant: { name: opengl, make: "" }
          - arch: aarch64
            variant: { name: gles, make: "FORCE_GLES=1 HAVE_VULKAN=0" }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm \
            zlib1g-dev libflac-dev liblzma-dev libzstd-dev \
            libgl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev libshaderc-dev

      - name: Build (${{ matrix.arch }} - ${{ matrix.variant.name }})
        run: |
          make clean
          make ${{ matrix.variant.make }} -j$(nproc)

      - name: Verify artifact
        run: |
          test -f yabasanshiro_libretro.so
          file yabasanshiro_libretro.so

      - uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro_libretro_linux_${{ matrix.arch }}_${{ matrix.variant.name }}
          path: yabasanshiro_libretro.so

  # ============================================================
  # Android 构建任务
  # ============================================================
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_android == true)
    strategy:
      fail-fast: false
      matrix:
        abi: 
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential nasm \
            zlib1g-dev libflac-dev liblzma-dev libzstd-dev

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Build Android core (${{ matrix.abi }})
        working-directory: src/libretro
        run: |
          make -f Makefile \
            platform=android \
            APP_ABI=${{ matrix.abi }} \
            -j$(nproc)

      - name: Verify artifact
        run: |
          SO_FILE="src/libretro/yabasanshiro_libretro_android.so"
          test -f "$SO_FILE"
          file "$SO_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: yabasanshiro_libretro_android_${{ matrix.abi }}
          path: src/libretro/yabasanshiro_libretro_android.so

  # ============================================================
  # 汇总 Release 附件
  # ============================================================
  release:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    needs: [linux, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f
          
      - name: Create release tarball
        run: |
          mkdir -p release_assets
          # 重命名 Linux 核心
          for f in artifacts/yabasanshiro_libretro_linux_*/yabasanshiro_libretro.so; do
            if [ -f "$f" ]; then
              dirname=$(basename $(dirname $f))
              cp "$f" "release_assets/${dirname}.so"
            fi
          done
          # 重命名 Android 核心
          for f in artifacts/yabasanshiro_libretro_android_*/yabasanshiro_libretro_android.so; do
            if [ -f "$f" ]; then
              dirname=$(basename $(dirname $f))
              cp "$f" "release_assets/${dirname}.so"
            fi
          done
          
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release_assets/*